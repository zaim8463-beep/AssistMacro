      - name: Fix Java and Kotlin JVM target
        run: |
          FILE=$(find project -name build.gradle.kts -path "*/app/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "app/build.gradle.kts not found"
            exit 1
          fi
          python3 - "$FILE" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace(
              "sourceCompatibility = JavaVersion.VERSION_1_8",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )
          s = s.replace(
              "targetCompatibility = JavaVersion.VERSION_1_8",
              "targetCompatibility = JavaVersion.VERSION_17"
          )
          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }",
                  1
              )
          else:
              s = s.replace(
                  "sourceCompatibility = JavaVersion.VERSION_1_8",
                  "sourceCompatibility = JavaVersion.VERSION_17"
              )
              s = s.replace(
                  "targetCompatibility = JavaVersion.VERSION_1_8",
                  "targetCompatibility = JavaVersion.VERSION_17"
              )
          open(p, "w").write(s)
          PY

      - name: Build APK
        run: gradle -p project --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistMacro-APK
          path: project/app/build/outputs/apk/debug/*.apk
          
